name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same ref are cancelled — a rapid push series only
# builds the latest state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Chrome for the prerender step lives in node_modules/.cache/puppeteer
      # (installed on demand by scripts/prerender.ts). Cache it so CI doesn't
      # re-download ~170MB every run.
      - name: Cache puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `pnpm build` already runs `pnpm check` as its first step — one
      # invocation exercises the whole gate (typecheck, data validation,
      # sitemap, vite build, prerender).
      - name: Build (includes check + prerender)
        run: pnpm build
