name: Social queue (daily)

# Runs once a day to publish a handful of products to Pinterest, Instagram,
# and the Facebook Page. Adjust the cron expression to control posting time —
# posts appear within ~5 minutes of the scheduled run.
#
# Required GitHub Actions secrets (Settings → Secrets → Actions):
#
# Pinterest (3):
#   PINTEREST_CLIENT_ID
#   PINTEREST_CLIENT_SECRET
#   PINTEREST_REFRESH_TOKEN
#
# Meta — FB Page posting (3, available NOW):
#   META_APP_ID
#   META_APP_SECRET
#   META_PAGE_ACCESS_TOKEN       # ~60-day TTL; refresh via social-oauth-setup.ts
#   META_FB_PAGE_ID
#
# Meta — IG posting (1 more, BLOCKED until business verification clears):
#   META_IG_BUSINESS_ID
#
# ⚠️  AUTOMATIC SCHEDULE IS DISABLED until secrets are configured.
#
# This gate runs in PARTIAL-PASS mode:
#   - FB-only:   META_APP_ID + META_APP_SECRET + META_PAGE_ACCESS_TOKEN +
#                META_FB_PAGE_ID present → run with --pinterest 0 --ig 0 --fb-page 1
#   - All three: every secret above present → run with --pinterest 3 --ig 1 --fb-page 1
#   - Pinterest-only / IG-only modes are also derived from which sets exist.
#
# When ready to ship FB Page posting:
#   1. Configure the 4 Meta + Pinterest secrets at
#      https://github.com/ProAxeCo/gadget-style/settings/secrets/actions
#   2. Uncomment the `schedule:` block below
#   3. Run via workflow_dispatch with dry_run=true to verify
#   4. Watch the first scheduled run land successfully before walking away

on:
  # schedule:
  #   # 10:00 AEST (Sydney) = 00:00 UTC → pin drops in the morning for AU audience
  #   - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      pinterest:
        description: "Override Pinterest pin count (blank = auto)"
        required: false
        default: ""
      instagram:
        description: "Override Instagram post count (blank = auto)"
        required: false
        default: ""
      fb_page:
        description: "Override FB Page post count (blank = auto)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (preview, no posts)"
        type: boolean
        default: true

# The log-commit step pushes docs/social-log back to main. The repo's default
# GITHUB_TOKEN permission is read-only, so without this block that push 403s —
# posts would go out but the dedup log would never persist, causing DUPLICATE
# posts the next day. Do not remove.
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4

      - name: Resolve which platforms can run
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_IG_BUSINESS_ID: ${{ secrets.META_IG_BUSINESS_ID }}
        run: |
          PINTEREST_OK=true
          for var in PINTEREST_CLIENT_ID PINTEREST_CLIENT_SECRET PINTEREST_REFRESH_TOKEN; do
            if [ -z "${!var}" ]; then PINTEREST_OK=false; fi
          done
          FB_OK=true
          for var in META_APP_ID META_APP_SECRET META_PAGE_ACCESS_TOKEN META_FB_PAGE_ID; do
            if [ -z "${!var}" ]; then FB_OK=false; fi
          done
          IG_OK=$FB_OK
          if [ -z "$META_IG_BUSINESS_ID" ]; then IG_OK=false; fi

          echo "PINTEREST_OK=$PINTEREST_OK" >> $GITHUB_ENV
          echo "FB_OK=$FB_OK" >> $GITHUB_ENV
          echo "IG_OK=$IG_OK" >> $GITHUB_ENV

          if [ "$PINTEREST_OK" = "false" ] && [ "$FB_OK" = "false" ] && [ "$IG_OK" = "false" ]; then
            echo "::warning::Cron skipped — no platform has a complete secrets set."
            echo "Configure secrets at https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "RUN_OK=false" >> $GITHUB_ENV
            exit 0
          fi

          # Derive default counts: enabled platform → its default; disabled → 0.
          DEFAULT_PIN=0
          DEFAULT_IG=0
          DEFAULT_FB=0
          if [ "$PINTEREST_OK" = "true" ]; then DEFAULT_PIN=3; fi
          if [ "$IG_OK" = "true" ]; then DEFAULT_IG=1; fi
          if [ "$FB_OK" = "true" ]; then DEFAULT_FB=1; fi

          # Allow workflow_dispatch overrides.
          PIN_INPUT="${{ inputs.pinterest }}"
          IG_INPUT="${{ inputs.instagram }}"
          FB_INPUT="${{ inputs.fb_page }}"
          PIN_COUNT=${PIN_INPUT:-$DEFAULT_PIN}
          IG_COUNT=${IG_INPUT:-$DEFAULT_IG}
          FB_COUNT=${FB_INPUT:-$DEFAULT_FB}

          echo "PIN_COUNT=$PIN_COUNT" >> $GITHUB_ENV
          echo "IG_COUNT=$IG_COUNT" >> $GITHUB_ENV
          echo "FB_COUNT=$FB_COUNT" >> $GITHUB_ENV
          echo "RUN_OK=true" >> $GITHUB_ENV

          echo "::notice::Platforms — Pinterest=$PINTEREST_OK FB=$FB_OK IG=$IG_OK"
          echo "::notice::Counts — pinterest=$PIN_COUNT ig=$IG_COUNT fb-page=$FB_COUNT"

      - name: Install dependencies
        if: env.RUN_OK == 'true'
        run: pnpm install --frozen-lockfile

      - name: Post queue
        if: env.RUN_OK == 'true'
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_IG_BUSINESS_ID: ${{ secrets.META_IG_BUSINESS_ID }}
        run: |
          DRY=${{ inputs.dry_run && '--dry-run' || '' }}
          pnpm tsx scripts/social-queue.ts \
            --pinterest $PIN_COUNT \
            --ig $IG_COUNT \
            --fb-page $FB_COUNT \
            $DRY

      - name: Commit log
        if: env.RUN_OK == 'true' && success() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain docs/social-log | grep -q .; then
            git add docs/social-log
            # [skip ci] so the docs-only log commit doesn't burn a CI run;
            # vercel.json's ignoreCommand also skips the pointless redeploy.
            git commit -m "chore(social): log daily post results [skip ci]"
            git push
          else
            echo "no new log entries"
          fi
